spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:7MB}
      max-request-size: ${MAX_REQUEST_SIZE:15MB}

dssm:
  ai:
    key: ${AI_API_KEY}
    url: ${AI_API_URL}
    model: ${AI_MODEL}
    max-tokens: ${AI_MAX_TOKENS}

  code:
    interval-lock-expire-seconds: ${INTERVAL_LOCK_EXPIRE_SECONDS:60}
    code-expire-seconds: ${CODE_EXPIRE_SECONDS:300}
    max-fail-number: ${MAX_FAIL_NUMBER:5}
    target-hash-secret: ${TARGET_HASH_SECRET}

  email:
    from: ${spring.mail.username}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_SECONDS:3600}

server:
  port: ${SERVER_PORT:8080}

aliyun:
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    region: ${OSS_REGION}
    endpoint: ${OSS_ENDPOINT}
    bucket: ${OSS_BUCKET}
    presigned-url-expire-seconds: ${PRESIGNED_URL_EXPIRE_SECONDS:3600}

  sms:
    access-key-id: ${SMS_ACCESS_KEY_ID}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET}
